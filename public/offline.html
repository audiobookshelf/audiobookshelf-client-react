<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#232323" />
    <title>Offline · audiobookshelf</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #373838;
        color: #fafafa;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        max-width: 22rem;
      }
      img {
        width: 96px;
        height: 96px;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 20px;
        color: #bbbbbb;
        line-height: 1.5;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 6px;
        background: #cd9d49;
        color: #232323;
        font-size: 0.95rem;
        font-weight: 600;
        padding: 10px 20px;
        cursor: pointer;
      }
      button:hover {
        background: #d8ab5c;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="images/icon.svg" alt="audiobookshelf" />
      <h1>You're offline</h1>
      <p>audiobookshelf needs a connection to load this page. Check your network and try again.</p>
      <button type="button" onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
